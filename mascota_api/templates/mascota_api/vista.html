{% extends "base.html" %}

{% block titulo %} Registrar Nueva Mascota {% endblock %}

{% block contenido %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="mb-4">Nueva Mascota</h1>
            
            <form method="post" class="p-4 border rounded bg-dark">
                {% csrf_token %}
                
                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Guardar Mascota
                </button>
            </form>
            
        </div>
    </div>
</div>
{% endblock %}

{% block saludo %}
<div class="container text-center">
    <p>¡Gracias por registrar a tu compañero!</p>
</div>
{% endblock %}
